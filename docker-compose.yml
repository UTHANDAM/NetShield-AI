services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netshield
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD: netshield_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netshield -d netshield"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL_OVERRIDE: postgresql://netshield:netshield_local_only@postgres:5432/netshield
      JWT_SECRET: change-this-for-production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/models:/app/app/ml/models
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  postgres_data:
