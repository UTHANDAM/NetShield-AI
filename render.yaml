services:
  - type: web
    name: netshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL_OVERRIDE
        fromDatabase:
          name: netshield-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://net-shield-ai-one.vercel.app
databases:
  - name: netshield-postgres
    databaseName: netshield
    user: netshield
